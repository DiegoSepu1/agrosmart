<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGROSMART - Administración de Pagos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-success" href="/"><i class="bi bi-speedometer2"></i> AGROSMART <span class="text-white fw-light">| Panel Interno</span></a>
        <div class="d-flex align-items-center gap-2">
            <a href="/inventario/admin" class="btn btn-sm btn-outline-light"><i class="bi bi-box-seam"></i> Productos</a>
            <a href="/admin/clientes" class="btn btn-sm btn-outline-light"><i class="bi bi-people"></i> Clientes</a>
            <a href="/admin/ventas" class="btn btn-sm btn-outline-light"><i class="bi bi-receipt"></i> Ventas</a>
            <a href="/admin/pagos" class="btn btn-sm btn-success"><i class="bi bi-cash-coin"></i> Pagos</a>
            <a href="/inventario/informes" class="btn btn-sm btn-outline-info"><i class="bi bi-bar-chart-line"></i> Informes</a>
            <a href="/logout" class="btn btn-sm btn-outline-danger"><i class="bi bi-box-arrow-right"></i> Salir</a>
        </div>
    </div>
</nav>

<div class="container-fluid px-4 mb-5">

    <div class="bg-white p-4 rounded shadow-sm mb-4">
        <h2 class="fw-bold text-dark mb-1"><i class="bi bi-cash-coin text-success"></i> Administración de Pagos</h2>
        <p class="text-muted mb-0 small">Registro de pagos recibidos (asociados a cada venta).</p>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-secondary text-white fw-bold py-3"><i class="bi bi-table"></i> Pagos</div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-3">N° Pago</th>
                        <th>Orden</th>
                        <th>Monto</th>
                        <th>Estado</th>
                        <th>Transacción externa</th>
                        <th>Fecha</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(pagos)}">
                        <td colspan="6" class="text-center text-muted py-4">No hay pagos registrados.</td>
                    </tr>
                    <tr th:each="p : ${pagos}">
                        <td class="ps-3 fw-bold text-secondary" th:text="'#' + ${p.idPago}">#1</td>
                        <td>
                            <a th:href="@{'/admin/ventas/' + ${p.idOrden}}" th:text="'Orden #' + ${p.idOrden}">Orden #1</a>
                        </td>
                        <td class="fw-bold text-success" th:text="'$' + ${#numbers.formatDecimal(p.monto, 1, 'POINT', 0, 'COMMA')}">$0</td>
                        <td>
                            <span th:if="${p.estadoPago == 'aprobado'}" class="badge bg-success" th:text="${p.estadoPago}">aprobado</span>
                            <span th:unless="${p.estadoPago == 'aprobado'}" class="badge bg-danger" th:text="${p.estadoPago}">rechazado</span>
                        </td>
                        <td th:text="${p.transaccionIdExterno != null ? p.transaccionIdExterno : '—'}">—</td>
                        <td th:text="${p.fechaPago != null ? #temporals.format(p.fechaPago, 'dd-MM-yyyy HH:mm') : '—'}">—</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
