<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGROSMART - Detalle de Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-success" href="/"><i class="bi bi-speedometer2"></i> AGROSMART <span class="text-white fw-light">| Panel Interno</span></a>
        <a href="/admin/clientes" class="btn btn-sm btn-outline-light"><i class="bi bi-arrow-left"></i> Volver a Clientes</a>
    </div>
</nav>

<div class="container mb-5">

    <div th:if="${exitoAdmin}" class="alert alert-success py-2 small"><span th:text="${exitoAdmin}"></span></div>

    <div class="row g-4">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white fw-bold"><i class="bi bi-person-vcard"></i> Ficha del Cliente</div>
                <div class="card-body">
                    <p><strong>ID Usuario:</strong> <span th:text="${cliente.usuario.idUsuario}">1</span></p>
                    <p><strong>Nombre:</strong> <span th:text="${cliente.usuario.nombreCompleto}">Nombre</span></p>
                    <p><strong>Email:</strong> <span th:text="${cliente.usuario.email}">email</span></p>
                    <p><strong>Teléfono:</strong> <span th:text="${cliente.usuario.telefono != null ? cliente.usuario.telefono : '—'}">—</span></p>
                    <p><strong>Rol:</strong> <span class="badge bg-dark" th:text="${cliente.usuario.rol}">rol</span></p>
                    <p class="mb-0"><strong>Estado:</strong>
                        <span th:if="${cliente.usuario.activo}" class="badge bg-success">Activo</span>
                        <span th:unless="${cliente.usuario.activo}" class="badge bg-danger">Inactivo</span>
                    </p>
                    <hr>
                    <h6 class="fw-bold text-muted">Datos del predio (Agricultor)</h6>
                    <div th:if="${cliente.agricultor != null}">
                        <p class="mb-1"><strong>RUT:</strong> <span th:text="${cliente.agricultor.rut}">—</span></p>
                        <p class="mb-1"><strong>Razón social:</strong> <span th:text="${cliente.agricultor.razonSocial}">—</span></p>
                        <p class="mb-0"><strong>Dirección predio:</strong> <span th:text="${cliente.agricultor.direccionPredio != null ? cliente.agricultor.direccionPredio : '—'}">—</span></p>
                    </div>
                    <p th:unless="${cliente.agricultor != null}" class="text-muted small mb-0">Sin ficha de agricultor asociada.</p>
                </div>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-warning fw-bold"><i class="bi bi-pencil-square"></i> Editar Cliente</div>
                <div class="card-body">
                    <form th:action="@{'/admin/clientes/' + ${cliente.usuario.idUsuario} + '/editar'}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre completo</label>
                            <input type="text" name="nombre" class="form-control" th:value="${cliente.usuario.nombreCompleto}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Teléfono</label>
                            <input type="text" name="telefono" class="form-control" th:value="${cliente.usuario.telefono}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">RUT</label>
                            <input type="text" name="rut" class="form-control" th:value="${cliente.agricultor != null ? cliente.agricultor.rut : ''}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Dirección del predio</label>
                            <input type="text" name="direccion" class="form-control" th:value="${cliente.agricultor != null ? cliente.agricultor.direccionPredio : ''}">
                        </div>
                        <button type="submit" class="btn btn-success fw-bold"><i class="bi bi-save"></i> Guardar cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
