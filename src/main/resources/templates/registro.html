<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGROSMART — Crear Cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .auth-card {
            max-width: 600px;
            margin: 50px auto;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .auth-header {
            background: linear-gradient(135deg, #198754 0%, #20c997 100%);
            color: white;
            padding: 30px;
            border-radius: 20px 20px 0 0;
            text-align: center;
        }
        .auth-body {
            padding: 40px;
            background: white;
            border-radius: 0 0 20px 20px;
        }
        .form-control {
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
        }
        .btn-auth {
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-light">

<div class="container">
    <div class="card auth-card">
        <div class="auth-header">
            <i class="bi bi-person-plus-fill fs-1"></i>
            <h3 class="fw-bold mt-2">Únete a AGROSMART</h3>
            <p class="mb-0 small">Obtén beneficios exclusivos para tu predio</p>
        </div>
        <div class="auth-body">
            
            <div th:if="${errorRegistro}" class="alert alert-danger py-2 small mb-4">
                <i class="bi bi-exclamation-circle"></i> <span th:text="${errorRegistro}"></span>
            </div>

            <form th:action="@{/registro}" method="post">
                <div class="row">
                    <div class="col-md-12">
                        <label class="form-label fw-bold small">Nombre Completo / Razón Social</label>
                        <input type="text" name="nombre" class="form-control" required placeholder="Juan Pérez o Agrícola SPA">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">RUT</label>
                        <input type="text" name="rut" class="form-control" required placeholder="12.345.678-9">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Teléfono</label>
                        <input type="text" name="telefono" class="form-control" required placeholder="+56 9 ...">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label fw-bold small">Dirección del Predio</label>
                        <input type="text" name="direccion" class="form-control" required placeholder="Calle, Número, Comuna">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label fw-bold small">Email</label>
                        <input type="email" name="email" class="form-control" required placeholder="ejemplo@correo.com">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label fw-bold small">Contraseña</label>
                        <input type="password" name="password" class="form-control" required placeholder="Mínimo 6 caracteres">
                    </div>
                </div>
                
                <div class="d-grid gap-2 mt-3">
                    <button type="submit" class="btn btn-success btn-auth">
                        Registrarme y Continuar
                    </button>
                    <a th:href="@{/checkout/auth}" class="btn btn-link text-muted text-decoration-none small">
                        <i class="bi bi-arrow-left"></i> Volver atrás
                    </a>
                </div>
            </form>

            <div class="mt-4 text-center">
                <p class="small text-muted">¿Ya tienes cuenta? <a th:href="@{/login}" class="text-success fw-bold">Inicia sesión</a></p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
