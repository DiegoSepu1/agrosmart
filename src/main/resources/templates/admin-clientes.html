<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGROSMART - Administración de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-success" href="/"><i class="bi bi-speedometer2"></i> AGROSMART <span class="text-white fw-light">| Panel Interno</span></a>
        <div class="d-flex align-items-center gap-2">
            <a href="/inventario/admin" class="btn btn-sm btn-outline-light"><i class="bi bi-box-seam"></i> Productos</a>
            <a href="/admin/clientes" class="btn btn-sm btn-success"><i class="bi bi-people"></i> Clientes</a>
            <a href="/admin/ventas" class="btn btn-sm btn-outline-light"><i class="bi bi-receipt"></i> Ventas</a>
            <a href="/admin/pagos" class="btn btn-sm btn-outline-light"><i class="bi bi-cash-coin"></i> Pagos</a>
            <a href="/inventario/informes" class="btn btn-sm btn-outline-info"><i class="bi bi-bar-chart-line"></i> Informes</a>
            <a href="/logout" class="btn btn-sm btn-outline-danger"><i class="bi bi-box-arrow-right"></i> Salir</a>
        </div>
    </div>
</nav>

<div class="container-fluid px-4 mb-5">

    <div th:if="${exitoAdmin}" class="alert alert-success py-2 small"><span th:text="${exitoAdmin}"></span></div>
    <div th:if="${errorAdmin}" class="alert alert-danger py-2 small"><span th:text="${errorAdmin}"></span></div>

    <div class="bg-white p-4 rounded shadow-sm mb-4">
        <h2 class="fw-bold text-dark mb-1"><i class="bi bi-people-fill text-success"></i> Administración de Clientes</h2>
        <p class="text-muted mb-0 small">Listado de clientes (agricultores) registrados en el sistema.</p>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-secondary text-white fw-bold py-3"><i class="bi bi-table"></i> Clientes Registrados</div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-3">ID</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>RUT</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(clientes)}">
                        <td colspan="7" class="text-center text-muted py-4">No hay clientes registrados.</td>
                    </tr>
                    <tr th:each="c : ${clientes}">
                        <td class="ps-3 fw-bold text-secondary" th:text="${c.usuario.idUsuario}">1</td>
                        <td class="fw-semibold" th:text="${c.usuario.nombreCompleto}">Nombre</td>
                        <td th:text="${c.usuario.email}">email</td>
                        <td th:text="${c.usuario.telefono != null ? c.usuario.telefono : '—'}">—</td>
                        <td th:text="${c.agricultor != null ? c.agricultor.rut : '—'}">—</td>
                        <td>
                            <span th:if="${c.usuario.activo}" class="badge bg-success-subtle text-success-emphasis">Activo</span>
                            <span th:unless="${c.usuario.activo}" class="badge bg-danger-subtle text-danger-emphasis">Inactivo</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{'/admin/clientes/' + ${c.usuario.idUsuario}}" class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i> Ver</a>
                            <form th:action="@{'/admin/clientes/' + ${c.usuario.idUsuario} + '/eliminar'}" method="post" class="d-inline"
                                  onsubmit="return confirm('¿Desactivar este cliente? (baja lógica, no se borran sus compras)');">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-person-x"></i> Desactivar</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
