<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGROSMART - Mis Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🌱 AGROSMART</a>
        <div class="d-flex align-items-center gap-2">
            <a href="/inventario" class="btn btn-sm btn-outline-light"><i class="bi bi-shop"></i> Catálogo</a>
            <a href="/carrito" class="btn btn-sm btn-outline-light"><i class="bi bi-cart3"></i> Carrito</a>
            <a href="/logout" class="btn btn-sm btn-outline-light"><i class="bi bi-box-arrow-right"></i> Salir</a>
        </div>
    </div>
</nav>

<div class="container mb-5">

    <div class="bg-white p-4 rounded shadow-sm mb-4">
        <h2 class="fw-bold text-dark mb-1"><i class="bi bi-bag-check text-success"></i> Mis Compras</h2>
        <p class="text-muted mb-0 small">Historial de compras de <span th:text="${nombreUsuario}">cliente</span>.</p>
    </div>

    <div th:if="${#lists.isEmpty(ordenes)}" class="text-center py-5 bg-white rounded shadow-sm">
        <i class="bi bi-bag-x display-3 text-muted"></i>
        <h5 class="mt-3 text-muted">Todavía no tienes compras registradas</h5>
        <a href="/inventario" class="btn btn-success mt-2">Ir al catálogo</a>
    </div>

    <div th:unless="${#lists.isEmpty(ordenes)}" class="card shadow-sm border-0">
        <div class="card-header bg-secondary text-white fw-bold py-3"><i class="bi bi-receipt"></i> Mis Órdenes</div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-3">N° Orden</th>
                        <th>Fecha</th>
                        <th>Total CLP</th>
                        <th>Estado</th>
                        <th>Pago</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="o : ${ordenes}">
                        <td class="ps-3 fw-bold text-secondary" th:text="'#' + ${o.idOrden}">#1</td>
                        <td th:text="${o.fechaCreacion != null ? #temporals.format(o.fechaCreacion, 'dd-MM-yyyy HH:mm') : '—'}">—</td>
                        <td class="fw-bold text-success" th:text="'$' + ${#numbers.formatDecimal(o.totalClp, 1, 'POINT', 0, 'COMMA')}">$0</td>
                        <td><span class="badge bg-dark" th:text="${o.estado}">estado</span></td>
                        <td>
                            <span th:if="${o.webpayStatus == 'aprobado'}" class="badge bg-success">Aprobado</span>
                            <span th:if="${o.webpayStatus == 'rechazado'}" class="badge bg-danger">Rechazado</span>
                            <span th:if="${o.webpayStatus != 'aprobado' and o.webpayStatus != 'rechazado'}" class="badge bg-secondary">Pendiente</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
