<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGROSMART — Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .auth-card {
            max-width: 500px;
            margin: 80px auto;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .auth-header {
            background: linear-gradient(135deg, #198754 0%, #20c997 100%);
            color: white;
            padding: 30px;
            border-radius: 20px 20px 0 0;
            text-align: center;
        }
        .auth-body {
            padding: 40px;
            background: white;
            border-radius: 0 0 20px 20px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
        }
        .btn-auth {
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-light">

<div class="container">
    <div class="card auth-card">
        <div class="auth-header">
            <i class="bi bi-person-circle fs-1"></i>
            <h3 class="fw-bold mt-2">Bienvenido de nuevo</h3>
            <p class="mb-0 small">Ingresa tus credenciales para continuar</p>
        </div>
        <div class="auth-body">
            
            <div th:if="${errorLogin}" class="alert alert-danger py-2 small mb-4">
                <i class="bi bi-exclamation-circle"></i> <span th:text="${errorLogin}"></span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold small">Email</label>
                    <input type="email" name="email" class="form-control" required placeholder="ejemplo@correo.com">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold small">Contraseña</label>
                    <input type="password" name="password" class="form-control" required placeholder="********">
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success btn-auth">
                        Iniciar Sesión
                    </button>
                    <a th:href="@{/checkout/auth}" class="btn btn-link text-muted text-decoration-none small">
                        <i class="bi bi-arrow-left"></i> Volver atrás
                    </a>
                </div>
            </form>

            <div class="mt-4 text-center">
                <p class="small text-muted">¿No tienes cuenta? <a th:href="@{/registro}" class="text-success fw-bold">Regístrate aquí</a></p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
