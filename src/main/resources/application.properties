spring.application.name=Agrosmart
server.port=8091

# Default to H2 in-memory database for local runs (no MySQL required)
spring.datasource.url=jdbc:h2:mem:agrosmartdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# If you want to use MySQL, override these properties (e.g., in application-dev.properties)
# spring.datasource.url=jdbc:mysql://localhost:3306/agrosmart_db
# spring.datasource.username=root
# spring.datasource.password=your_password_here